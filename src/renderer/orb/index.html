<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Sparky AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root" class="collapsed">
      <!-- Küçük hâl: yüzen küre + bilgi baloncuğu -->
      <div class="orb-layer">
        <button
          id="orb"
          class="orb hit"
          aria-label="Sparky AI"
          title="Tık: paneli aç · Çift tık / orta tık: panodaki metni prompt yap · Ctrl+tık: son sonucu kopyala · Sağ tık: menü"
        >
          <span class="ring" aria-hidden="true"></span>
          <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.2 13.9 9 20.8 10.9 13.9 12.8 12 19.6 10.1 12.8 3.2 10.9 10.1 9Z" />
            <circle cx="18.4" cy="5.2" r="1.5" opacity=".85" />
            <circle cx="6.1" cy="17.4" r="1.05" opacity=".6" />
          </svg>
          <span id="badge" class="badge" hidden></span>
        </button>
        <div id="bubble" class="bubble hit" hidden>
          <span id="bubbleText"></span>
        </div>
      </div>

      <!-- Genişletilmiş hâl -->
      <section id="card" class="card hit" aria-label="Prompt paneli">
        <header class="card-head">
          <span class="mini-orb" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2.2 13.9 9 20.8 10.9 13.9 12.8 12 19.6 10.1 12.8 3.2 10.9 10.1 9Z" /></svg>
          </span>
          <span class="brand">Sparky<span class="brand-dim"> AI</span></span>
          <span id="statusPill" class="status" data-kind="idle">
            <i class="dot" aria-hidden="true"></i><span id="statusText">Hazır</span>
          </span>
          <span class="grow"></span>
          <button id="btnMenu" class="icon" title="Menü (sağ tık)">⋯</button>
          <button id="btnCollapse" class="icon" title="Küçült (Esc)">‹</button>
          <button id="btnHide" class="icon" title="Tepsiye gizle">✕</button>
        </header>

        <div class="body">
          <div class="row-label">
            <label for="input">Metniniz</label>
            <button id="btnPaste" class="link" title="Panodaki metni yapıştır">panodan al</button>
          </div>
          <textarea
            id="input"
            spellcheck="false"
            placeholder="Ne istediğinizi kendi cümlelerinizle yazın.&#10;Ctrl+Enter → üret"
          ></textarea>

          <div class="toolbar">
            <select id="style" title="Prompt biçimi"></select>
            <button id="deep" class="chip" title="Analiz → yaz → cilala (3 aşama, daha yavaş ama daha iyi)">
              Derin mod
            </button>
            <button id="clarify" class="chip" title="Belirsiz noktalar için önce sana soru sorsun">
              Soru sor
            </button>
            <span class="grow"></span>
            <button id="btnStop" class="btn danger" hidden>Durdur</button>
            <button id="btnGen" class="btn primary">Üret</button>
          </div>

          <div class="row-label out">
            <label for="output">Prompt</label>
            <span id="meta" class="meta"></span>
          </div>
          <div id="output" class="output" tabindex="0">
            <div class="empty">Üretilen prompt burada belirecek.</div>
          </div>

          <!-- Model netleştirme sorusu sorduğunda çıktının yerini alır -->
          <div id="qa" class="qa" hidden>
            <p class="qa-lead">Daha iyi bir prompt için birkaç şeyi netleştirelim:</p>
            <div id="qaList"></div>
            <div class="qa-actions">
              <button id="qaSubmit" class="btn primary">Cevapla ve üret</button>
              <button id="qaSkip" class="btn">Sormadan üret</button>
            </div>
          </div>

          <div id="suggests" class="suggests" hidden></div>

          <div class="out-actions">
            <button id="btnCopy" class="btn primary" disabled>Kopyala</button>
            <button id="btnCopyClose" class="btn" disabled>Kopyala &amp; küçült</button>
            <button id="btnRegen" class="btn" disabled>Yeniden</button>
            <span class="grow"></span>
            <button id="btnHistory" class="btn ghost">Geçmiş</button>
          </div>

          <div class="refine">
            <input id="refine" placeholder="Düzeltme iste: “daha kısa”, “İngilizce olsun”, “JSON çıktı ekle”…" spellcheck="false" />
            <button id="btnRefine" class="btn" disabled>Uygula</button>
          </div>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
