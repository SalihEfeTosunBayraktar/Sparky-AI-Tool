<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Sparky AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root" class="collapsed">
      <!-- Küçük hâl: yüzen küre + bilgi baloncuğu -->
      <div class="orb-layer">
        <button
          id="orb"
          class="orb hit"
          aria-label="Sparky AI"
          title="Tık: paneli aç · Çift tık / orta tık: panodaki metni prompt yap · Ctrl+tık: son sonucu kopyala · Sağ tık: menü"
          data-i18n-title="app.orbTooltip"
        >
          <span class="ring" aria-hidden="true"></span>
          <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.2 13.9 9 20.8 10.9 13.9 12.8 12 19.6 10.1 12.8 3.2 10.9 10.1 9Z" />
            <circle cx="18.4" cy="5.2" r="1.5" opacity=".85" />
            <circle cx="6.1" cy="17.4" r="1.05" opacity=".6" />
          </svg>
          <span id="badge" class="badge" hidden></span>
        </button>
        <div id="bubble" class="bubble hit" hidden>
          <span id="bubbleText"></span>
          <!-- Kuyrukta bekleyen bildirim sayısı — "boğulmadan" haberdar etme. -->
          <span id="bubbleQueueCount" class="bubble-queue-count" hidden></span>
          <button id="btnBubbleCopy" class="bubble-copy" title="Sonucu panoya kopyala" data-i18n-title="card.btnCopy" hidden>📋</button>
        </div>
      </div>

      <!-- Genişletilmiş hâl -->
      <section id="card" class="card hit" aria-label="Prompt paneli">
        <header class="card-head">
          <span class="mini-orb" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2.2 13.9 9 20.8 10.9 13.9 12.8 12 19.6 10.1 12.8 3.2 10.9 10.1 9Z" /></svg>
          </span>
          <span class="brand">Sparky<span class="brand-dim"> AI</span></span>
          <span id="statusPill" class="status" data-kind="idle">
            <i class="dot" aria-hidden="true"></i><span id="statusText" data-i18n="app.ready">Hazır</span>
          </span>
          <span class="grow"></span>
          <button id="btnMenu" class="icon" title="Menü (sağ tık)" data-i18n-title="card.menuTitle">⋯</button>
          <button id="btnCollapse" class="icon" title="Küçült (Esc)" data-i18n-title="card.collapseTitle">‹</button>
          <button id="btnHide" class="icon" title="Tepsiye gizle" data-i18n-title="card.hideTitle">✕</button>
        </header>

        <div class="body">
          <div class="row-label">
            <label for="input" data-i18n="card.inputLabel">Metniniz veya UI Tasarımı</label>
            <button id="btnPaste" class="link" title="Panodaki metni yapıştır" data-i18n="card.pasteFromClipboard" data-i18n-title="card.pasteFromClipboard">panodan al</button>
          </div>

          <div id="imgPreviewContainer" class="img-preview-container" hidden>
            <img id="imgPreview" class="img-preview" alt="Yüklenen UI Tasarımı" />
            <span class="img-info" data-i18n="card.uiImageAttached">UI Tasarımı Ekli</span>
            <button id="btnRemoveImg" class="btn-remove-img" title="Görseli kaldır" data-i18n-title="card.removeImage">✕</button>
          </div>

          <div class="input-composer" id="inputComposer">
            <button id="btnClearInput" class="btn-clear-input" title="Metni ve çıktıyı temizle" data-i18n-title="card.btnClearInputTitle" hidden>✕</button>
            <textarea
              id="input"
              spellcheck="false"
              placeholder="Ne istediğinizi yazın veya UI tasarım görseli yükleyin.&#10;Ctrl+Enter → üret"
              data-i18n-placeholder="card.inputPlaceholder"
            ></textarea>

            <div class="composer-bar">
              <div class="toolbar">
                <input type="file" id="imgFileInput" accept="image/*" hidden />
                <button id="btnAttachImg" class="chip icon-chip" title="Görsel Yükle" data-i18n="card.btnAttachImage" data-i18n-title="card.btnAttachImage">
                  📷
                </button>
                <select id="projectSelect" class="chip-select" title="Aktif Proje" data-i18n-title="projects.activeBadge"></select>
                <select id="modeSelect" class="chip-select" title="Çalışma Modu" data-i18n-title="modes.activeTitle"></select>
                <select id="style" title="Prompt biçimi"></select>
                <button id="deep" class="chip" title="Analiz → yaz → cilala (3 aşama, daha yavaş ama daha iyi)" data-i18n="card.deepMode" data-i18n-title="card.deepModeTitle">
                  Derin mod
                </button>
                <button id="autoMode" class="chip" title="İsteğin karmaşıklığına ve netliğine göre Otomatik Derin Mod veya Soru Sorma akışını seçer" data-i18n="card.autoMode" data-i18n-title="card.autoModeTitle">
                  🤖 Oto mod
                </button>
                <button id="clarify" class="chip" title="Belirsiz noktalar için önce sana soru sorsun" data-i18n="card.askQuestions" data-i18n-title="card.askQuestionsTitle">
                  Soru sor
                </button>
              </div>

              <div class="composer-actions">
                <button id="btnStop" class="btn danger" hidden data-i18n="card.btnStop">Durdur</button>
                <button id="btnGen" class="btn primary btn-generate">
                  <span class="btn-gen-spark" aria-hidden="true">✨</span>
                  <span data-i18n="card.btnGenerate">Üret</span>
                </button>
              </div>
            </div>
          </div>

          <div class="row-label out">
            <label for="output" data-i18n="card.promptOutputLabel">Prompt</label>
            <span id="meta" class="meta"></span>
          </div>
          <div id="output" class="output" tabindex="0">
            <div class="empty" data-i18n="card.emptyPrompt">Üretilen prompt burada belirecek.</div>
          </div>

          <!-- Model netleştirme sorusu sorduğunda çıktının yerini alır -->
          <div id="qa" class="qa" hidden>
            <p class="qa-lead" data-i18n="card.qaLead">Daha iyi bir prompt için birkaç şeyi netleştirelim:</p>
            <div id="qaList"></div>
            <div class="qa-actions">
              <button id="qaSubmit" class="btn primary" data-i18n="card.qaSubmit">Cevapla ve üret</button>
              <button id="qaSkip" class="btn" data-i18n="card.qaSkip">Sormadan üret</button>
            </div>
          </div>

          <div id="suggests" class="suggests" hidden></div>

          <div class="out-actions">
            <button id="btnCopy" class="btn primary" disabled data-i18n="card.btnCopy">Kopyala</button>
            <button id="btnCopyClose" class="btn" disabled data-i18n="card.btnCopyClose">Kopyala &amp; küçült</button>
            <button id="btnRegen" class="btn" disabled data-i18n="card.btnRegen">Yeniden</button>
            <span class="grow"></span>
            <button id="btnHistory" class="btn ghost" data-i18n="card.btnHistory">Geçmiş</button>
          </div>

          <div class="refine">
            <input id="refine" placeholder="Düzeltme iste: “daha kısa”, “İngilizce olsun”, “JSON çıktı ekle”…" spellcheck="false" data-i18n="card.refinePlaceholder" data-i18n-attr="placeholder" />
            <button id="btnRefine" class="btn" disabled data-i18n="card.btnApplyRefine">Uygula</button>
          </div>

          <div class="card-footer-info">
            <span id="tokenCounter" class="token-counter" title="Son istek / Toplam oturum token kullanımı">Tokens: 0</span>
          </div>
        </div>
      </section>
    </div>

    <script src="../locales/tr.js"></script>
    <script src="../locales/en.js"></script>
    <script src="../i18n.js"></script>
    <script src="../audioFeedback.js"></script>
    <script src="imageHandler.js"></script>
    <script src="notificationQueue.js"></script>
    <script src="multimodalRenderer.js"></script>
    <script src="app.js"></script>
  </body>
</html>
